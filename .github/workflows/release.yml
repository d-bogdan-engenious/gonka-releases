name: Build and Release inferenced + dapi (Linux amd64)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch on gonka-ai/gonka to build from"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gonka-ai/gonka at specified branch
        uses: actions/checkout@v4
        with:
          repository: gonka-ai/gonka
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes

      - name: Get last merged PR number for tag
        id: tag
        run: |
          PR_NUM=$(gh pr list --repo gonka-ai/gonka --state merged --limit 1 --json number --jq '.[0].number')
          echo "tag=pr-${PR_NUM}" >> $GITHUB_OUTPUT
          echo "Tag will be: pr-${PR_NUM}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build inferenced + dapi via decentralized-api Dockerfile
        run: |
          VERSION=$(git describe --always)
          COMMIT=$(git log -1 --format='%H')
          INFERENCED_LDFLAGS="-X github.com/cosmos/cosmos-sdk/version.Name=inference-chain \
            -X github.com/cosmos/cosmos-sdk/version.AppName=inferenced \
            -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
            -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT}"
          DAPI_BUILD_FLAGS="-ldflags '-X github.com/cosmos/cosmos-sdk/version.Name=decentralized-api \
            -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
            -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT}'"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg LDFLAGS="${INFERENCED_LDFLAGS}" \
            --build-arg BUILD_FLAGS="${DAPI_BUILD_FLAGS}" \
            --build-arg GOOS=linux \
            --build-arg GOARCH=amd64 \
            --build-arg BLST_PORTABLE=true \
            --target binary-exporter \
            -f decentralized-api/Dockerfile \
            --output type=local,dest=./output \
            .

      - name: Create zips
        run: |
          cd output/build_output
          zip inferenced-linux-amd64.zip inferenced
          zip decentralized-api-amd64.zip decentralized-api libwasmvm_muslc.x86_64.a libgcc_s.so.1
          mv *.zip ../..

      - name: Create release and upload both zips
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }} (from ${{ github.event.inputs.branch }})"
          prerelease: true
          files: |
            inferenced-linux-amd64.zip
            decentralized-api-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
