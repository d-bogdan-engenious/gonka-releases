name: Build and Release inferenced (Linux amd64)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch on gonka-ai/gonka to build from"
        required: true
      tag:
        description: "Release tag (e.g. v0.2.12-linux)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gonka-ai/gonka at specified branch
        uses: actions/checkout@v4
        with:
          repository: gonka-ai/gonka
          ref: ${{ github.event.inputs.branch }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes

      - name: Build linux/amd64 binary via Docker
        working-directory: ./inference-chain
        run: make build-linux-docker

      - name: Zip binary as inferenced-linux-amd64.zip (matches launch.py expectation)
        run: |
          cd inference-chain/build/linux/amd64
          zip inferenced-linux-amd64.zip inferenced

      - name: Create release and upload inferenced-linux-amd64.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "inferenced ${{ github.event.inputs.tag }} (from ${{ github.event.inputs.branch }})"
          prerelease: true
          files: inference-chain/build/linux/amd64/inferenced-linux-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
