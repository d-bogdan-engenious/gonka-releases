name: Build and Release inferenced (Linux amd64)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch on gonka-ai/gonka to build from"
        required: true
      tag:
        description: "Release tag (e.g. v0.2.12-linux)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gonka-ai/gonka at specified branch
        uses: actions/checkout@v4
        with:
          repository: gonka-ai/gonka
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Verify runner architecture
        run: uname -m && uname -a

      - name: Install musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build static linux/amd64 binary
        working-directory: ./inference-chain
        run: |
          VERSION=$(git describe --always)
          COMMIT=$(git log -1 --format='%H')
          LDFLAGS="-X github.com/cosmos/cosmos-sdk/version.Name=inference-chain \
            -X github.com/cosmos/cosmos-sdk/version.AppName=inferenced \
            -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
            -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT} \
            -extldflags '-static'"

          go mod download

          WASMVM_DIR=$(go env GOPATH)/pkg/mod/github.com/\!cosm\!wasm/wasmvm/v2@v2.2.4/internal/api
          curl -L -o "${WASMVM_DIR}/libwasmvm_muslc.x86_64.a" \
            https://github.com/CosmWasm/wasmvm/releases/download/v2.2.4/libwasmvm_muslc.x86_64.a

          mkdir -p build/linux/amd64
          CGO_ENABLED=1 \
          CC=musl-gcc \
          GOOS=linux GOARCH=amd64 \
          go build -tags muslc -ldflags "${LDFLAGS}" \
            -o build/linux/amd64/inferenced ./cmd/inferenced/main.go

      - name: Zip binary as inferenced-linux-amd64.zip
        run: |
          cd inference-chain/build/linux/amd64
          zip inferenced-linux-amd64.zip inferenced

      - name: Create release and upload inferenced-linux-amd64.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "inferenced ${{ github.event.inputs.tag }} (from ${{ github.event.inputs.branch }})"
          prerelease: true
          files: inference-chain/build/linux/amd64/inferenced-linux-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
