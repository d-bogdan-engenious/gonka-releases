name: Build and Release inferenced (Linux amd64)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch on gonka-ai/gonka to build from"
        required: true
      tag:
        description: "Release tag (e.g. v0.2.12-linux)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gonka-ai/gonka at specified branch
        uses: actions/checkout@v4
        with:
          repository: gonka-ai/gonka
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes

      - name: Prepare build context (same as Makefile DOCKER_BUILD_UPGRADE)
        working-directory: ./inference-chain
        run: |
          rm -rf .docker-context && mkdir -p .docker-context/inference-chain
          cp -r * .docker-context/inference-chain/ 2>/dev/null || true
          cp -r .[^.]* .docker-context/inference-chain/ 2>/dev/null || true
          rm -rf .docker-context/inference-chain/.docker-context
          mkdir -p .docker-context/cosmovisor
          cp -r ../cosmovisor/* .docker-context/cosmovisor/

      - name: Build inferenced binary via Dockerfile
        working-directory: ./inference-chain
        run: |
          VERSION=$(git describe --always)
          COMMIT=$(git log -1 --format='%H')
          LDFLAGS="-X github.com/cosmos/cosmos-sdk/version.Name=inference-chain \
            -X github.com/cosmos/cosmos-sdk/version.AppName=inferenced \
            -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
            -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg LDFLAGS="${LDFLAGS}" \
            --build-arg GOOS=linux \
            --build-arg GOARCH=amd64 \
            --target binary-exporter \
            -f Dockerfile \
            --output type=local,dest=./output \
            .docker-context

      - name: Zip binary as inferenced-linux-amd64.zip
        working-directory: ./inference-chain
        run: |
          cd output/build_output
          zip inferenced-linux-amd64.zip inferenced
          mv inferenced-linux-amd64.zip ../..

      - name: Create release and upload inferenced-linux-amd64.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "inferenced ${{ github.event.inputs.tag }} (from ${{ github.event.inputs.branch }})"
          prerelease: true
          files: inference-chain/inferenced-linux-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
