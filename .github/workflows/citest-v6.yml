name: citest v6
on:
  workflow_dispatch:
    inputs:
      repo:
        default: "gonka-ai/gonka"
      branch:
        required: true
        default: "devshard-0.2.x-v6"
      target:
        description: "testenv make target (citest-stack, citest-load, citest-peerrpc-overlay, citest-peerrpc-limits, ...)"
        required: true
        default: "citest-stack"
      overlay:
        description: "inject QA overlays (overlays/citest/*.go + overlays/citest.mk) from this repo before make"
        type: boolean
        default: true
      load_env:
        description: "extra env for the make target, space-separated KEY=VAL (e.g. LOAD_RPS=16 LOAD_FAULT=pause)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  citest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/checkout@v4
        with:
          repository: d-bogdan-engenious/gonka-releases
          path: _ci
      - name: record SHA + versions
        run: |
          echo "SHA=$(git rev-parse HEAD)" | tee /tmp/citest.log
          docker version --format 'docker={{.Server.Version}}' | tee -a /tmp/citest.log
          docker buildx version | tee -a /tmp/citest.log
          docker compose version | tee -a /tmp/citest.log
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache-dependency-path: |
            devshard/go.sum
            common/go.sum
            decentralized-api/go.sum
      - name: go version
        run: go version | tee -a /tmp/citest.log
      - name: inject QA overlays
        if: ${{ github.event.inputs.overlay == 'true' }}
        run: |
          set -e
          if ls _ci/overlays/citest/*.go >/dev/null 2>&1; then
            cp -v _ci/overlays/citest/*.go devshard/testenv/citest/ | tee -a /tmp/citest.log
          fi
          if ls _ci/overlays/scripts/* >/dev/null 2>&1; then
            mkdir -p devshard/testenv/scripts
            cp -v _ci/overlays/scripts/* devshard/testenv/scripts/ | tee -a /tmp/citest.log
            chmod +x devshard/testenv/scripts/*.sh
          fi
          if [ -f _ci/overlays/citest.mk ]; then
            cat _ci/overlays/citest.mk >> devshard/testenv/Makefile
            echo "appended overlays/citest.mk to testenv/Makefile" | tee -a /tmp/citest.log
          fi
          (cd devshard/testenv && make -s list-citest-targets) | tee -a /tmp/citest.log
      - name: build-devshardd
        working-directory: ./devshard/testenv
        run: make build-devshardd 2>&1 | tee -a /tmp/citest.log
      - name: run ${{ github.event.inputs.target }}
        id: run
        working-directory: ./devshard/testenv
        continue-on-error: true
        run: |
          set -o pipefail
          env ${{ github.event.inputs.load_env }} make ${{ github.event.inputs.target }} 2>&1 | tee -a /tmp/citest.log
      - name: tail + container state
        if: always()
        run: |
          echo "=== docker ps -a ===" | tee -a /tmp/citest.log
          docker ps -a | tee -a /tmp/citest.log || true
          echo "=== make result: ${{ steps.run.outcome }} ===" | tee -a /tmp/citest.log
          mkdir -p /tmp/results-load
          cp -r devshard/testenv/results-load/. /tmp/results-load/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citest-${{ github.event.inputs.target }}-${{ github.run_id }}
          path: |
            /tmp/citest.log
            /tmp/results-load
      - name: fail job if make failed
        if: steps.run.outcome == 'failure'
        run: exit 1
